<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight Arcana - 闇夜のタロット占者</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0910;
      color: #e2e8f0;
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .app-container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      background: radial-gradient(circle at center, #181226 0%, #0b0910 100%);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      padding-bottom: 12px;
    }
    .logo {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: #c084fc;
      letter-spacing: 1px;
    }
    .badge {
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: #d8b4fe;
    }
    .oracle-section {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(24, 18, 38, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.2);
      padding: 14px;
      border-radius: 12px;
    }
    .oracle-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #a855f7;
      background: #2e1065;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #f3e8ff;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      animation: pulse-glow 3s infinite;
    }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
      50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.7); }
      100% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
    }
    .oracle-info h2 {
      font-size: 15px;
      color: #f3e8ff;
      font-family: 'Cinzel', serif;
      margin-bottom: 2px;
    }
    .oracle-info p {
      font-size: 11px;
      color: #a855f7;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 12px;
      color: #d8b4fe;
    }
    .input-dark {
      width: 100%;
      background: rgba(15, 12, 23, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
      transition: all 0.3s;
    }
    .input-dark:focus {
      outline: none;
      border-color: #c084fc;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
    }
    .chat-box, .secret-box {
      padding: 14px;
      border-radius: 0 12px 12px 0;
      font-size: 13px;
      line-height: 1.6;
      animation: fadeIn 0.6s ease-in-out;
    }
    .chat-box {
      background: rgba(15, 12, 23, 0.9);
      border-left: 3px solid #9333ea;
      color: #cbd5e1;
    }
    .secret-box {
      background: rgba(46, 10, 20, 0.9);
      border-left: 3px solid #ef4444;
      color: #fecaca;
      display: none;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cards-area {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 5px 0;
      perspective: 1000px;
      transition: all 0.4s ease;
    }
    .tarot-card {
      width: 65px;
      height: 100px;
      background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%);
      border: 2px solid #7e22ce;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 18px;
      color: #a855f7;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1), border-color 0.3s, box-shadow 0.3s;
      transform-style: preserve-3d;
    }
    .tarot-card.flipped {
      transform: rotateY(180deg) translateY(-8px);
      background: linear-gradient(135deg, #4c1d95 0%, #311042 100%);
      border-color: #c084fc;
      color: #f3e8ff;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
    }
    .tarot-card:hover:not(.flipped) {
      transform: translateY(-4px);
      border-color: #a855f7;
    }

    .action-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-dark {
      background: linear-gradient(135deg, #7e22ce 0%, #581c87 100%);
      color: #fff;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(126, 34, 206, 0.4);
      font-family: 'Noto Serif JP', serif;
      letter-spacing: 1px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-dark:active {
      transform: scale(0.98);
    }
    .btn-gold {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
      display: none;
      animation: gold-pulse 2s infinite;
    }
    @keyframes gold-pulse {
      0% { box-shadow: 0 0 10px rgba(217, 119, 6, 0.4); }
      50% { box-shadow: 0 0 22px rgba(245, 158, 11, 0.8); }
      100% { box-shadow: 0 0 10px rgba(217, 119, 6, 0.4); }
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-bar">
      <div class="logo"><i class="fa-solid fa-moon"></i> MIDNIGHT ARCANA</div>
      <div class="badge">闇夜のAI深層鑑定</div>
    </div>

    <div class="oracle-section">
      <div class="oracle-avatar">
        <i class="fa-solid fa-eye"></i>
      </div>
      <div class="oracle-info">
        <h2>深層の占者 レイラ</h2>
        <p>“あなたの迷いを、ここに書き記しなさい…”</p>
      </div>
    </div>

    <div class="input-group" id="inputGroup">
      <label for="userQuery"><i class="fa-solid fa-feather"></i> あなたの悩みや相手との関係</label>
      <input type="text" id="userQuery" class="input-dark" placeholder="例：あの人は今、私のことをどう思っている？">
    </div>

    <div class="chat-box" id="chatMessage">
      深夜の闇へようこそ。上の欄にあなたの悩みを打ち込み、下の3枚のカードから直感で1枚選びなさい。カードとあなたの思念が共鳴します。
    </div>

    <div class="secret-box" id="secretMessage">
      <strong>【禁断の深層解放・真実の神託】</strong><br>
      お支払いが確認されました。カードの奥底に封じられていた『本当の結末』と『お相手の偽らざるスマホの心理』を解き放ちます……。
    </div>

    <div class="cards-area" id="cardsArea">
      <div class="tarot-card" id="card1" onclick="selectCard(1)"><i class="fa-solid fa-wand-sparkles"></i></div>
      <div class="tarot-card" id="card2" onclick="selectCard(2)"><i class="fa-solid fa-wand-sparkles"></i></div>
      <div class="tarot-card" id="card3" onclick="selectCard(3)"><i class="fa-solid fa-wand-sparkles"></i></div>
    </div>

    <div class="action-row">
      <button class="btn-dark" id="actionBtn" onclick="startReading()">運命のカードを引く</button>
      <a href="https://buy.stripe.com/7sY00i95A62B6gX0luEZ20k" target="_blank" class="btn-dark btn-gold" id="payBtn">
        <i class="fa-solid fa-lock"></i> 禁断の深層へ踏み込む（¥300）
      </a>
    </div>

    <div class="footer-note">
      © Midnight Arcana • Powered by OpenAI & Vercel
    </div>
  </div>

  <script>
    let selectedCardNum = null;

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if(urlParams.get('unlocked') === 'true') {
        document.getElementById('chatMessage').innerText = "【決済完了：深層の扉は開かれました】";
        document.getElementById('secretMessage').style.display = 'block';
        document.getElementById('cardsArea').style.display = 'none';
        document.getElementById('inputGroup').style.display = 'none';
        document.getElementById('actionBtn').innerText = 'もう一度占う';
        document.getElementById('actionBtn').onclick = function() { window.location.href = window.location.pathname; };
        document.getElementById('payBtn').style.display = 'none';
      }
    };

    function selectCard(num) {
      selectedCardNum = num;
      for(let i = 1; i <= 3; i++) {
        const c = document.getElementById(`card${i}`);
        if(i === num) {
          c.classList.add('flipped');
          c.innerHTML = '<i class="fa-solid fa-eye-low-vision" style="transform: rotateY(180deg);"></i>';
        } else {
          c.classList.remove('flipped');
          c.innerHTML = '<i class="fa-solid fa-wand-sparkles"></i>';
        }
      }

      const query = document.getElementById('userQuery').value.trim();
      const targetText = query ? `「${query}」というあなたの迷いについて` : "あなたの心に秘めた迷いについて";
      document.getElementById('chatMessage').innerText = `${targetText}、第 ${num} のカードが共鳴しました。「運命の結末を覗く」を押してください。`;
      document.getElementById('actionBtn').innerText = '運命の結末を覗く';
    }

    async function startReading() {
      const query = document.getElementById('userQuery').value.trim();
      if(!query) {
        alert('まずは上の欄にあなたの悩みや気になることを入力してください。');
        return;
      }
      if(!selectedCardNum) {
        alert('下の3枚のカードから1枚選んでください。');
        return;
      }

      const actionBtn = document.getElementById('actionBtn');
      actionBtn.disabled = true;
      actionBtn.innerHTML = '<span class="spinner"></span>神託を降ろしています...';
      document.getElementById('chatMessage').innerText = "深淵の向こうより、AI占者レイラがあなただけの神託を紡ぎ出しています……少々お待ちください。";

      try {
        // Vercelのサーバーレス機能（api/fortune）へ安全にリクエストを送る
        const response = await fetch("/api/fortune", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: query, cardNum: selectedCardNum })
        });

        const data = await response.json();
        if(data.result) {
          document.getElementById('chatMessage').innerText = data.result;
        } else {
          throw new Error("AIからの応答を取得できませんでした");
        }
      } catch (error) {
        document.getElementById('chatMessage').innerText = `【カードの波動エラー】「${query}」に対する神託の共鳴が微弱です。もう一度お試しください。`;
      }

      const cardsArea = document.getElementById('cardsArea');
      cardsArea.style.opacity = '0';
      setTimeout(() => { cardsArea.style.display = 'none'; }, 300);

      document.getElementById('inputGroup').style.display = 'none';

      actionBtn.disabled = false;
      actionBtn.innerText = '最初からやり直す';
      actionBtn.onclick = function() { location.reload(); };
      
      document.getElementById('payBtn').style.display = 'block';
      const secretBox = document.getElementById('secretMessage');
      secretBox.style.display = 'block';
      secretBox.innerHTML = `<strong>【この先の禁断の深層】</strong><br>「${query}」に対するあの人の本当のスマホの連絡履歴の心理、そして2人が迎える衝撃の未来結末を覗くには、下の黄金のボタンを解除してください。`;
    }
  </script>

</body>
</html>
