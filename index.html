<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight Arcana - 闇夜のタロット占者</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0910;
      color: #e2e8f0;
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .app-container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      background: radial-gradient(circle at center, #181226 0%, #0b0910 100%);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      padding-bottom: 12px;
    }
    .logo {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: #c084fc;
      letter-spacing: 1px;
    }
    .badge {
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: #d8b4fe;
    }
    .oracle-section {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(24, 18, 38, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.2);
      padding: 14px;
      border-radius: 12px;
    }
    .oracle-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #a855f7;
      background: #2e1065;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #f3e8ff;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .oracle-info h2 {
      font-size: 15px;
      color: #f3e8ff;
      font-family: 'Cinzel', serif;
      margin-bottom: 2px;
    }
    .oracle-info p {
      font-size: 11px;
      color: #a855f7;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 12px;
      color: #d8b4fe;
    }
    .input-dark {
      width: 100%;
      background: rgba(15, 12, 23, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
    }
    .input-dark:focus {
      outline: none;
      border-color: #c084fc;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }
    .chat-box {
      background: rgba(15, 12, 23, 0.9);
      border-left: 3px solid #9333ea;
      padding: 14px;
      border-radius: 0 12px 12px 0;
      min-height: 90px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .cards-area {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 5px 0;
    }
    .tarot-card {
      width: 65px;
      height: 100px;
      background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%);
      border: 2px solid #7e22ce;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s, border-color 0.3s;
      font-size: 18px;
      color: #a855f7;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .tarot-card:hover, .tarot-card.selected {
      transform: translateY(-6px);
      border-color: #c084fc;
      color: #f3e8ff;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
    }
    .action-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-dark {
      background: linear-gradient(135deg, #7e22ce 0%, #581c87 100%);
      color: #fff;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(126, 34, 206, 0.4);
      font-family: 'Noto Serif JP', serif;
      letter-spacing: 1px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-dark:active {
      transform: scale(0.98);
    }
    .btn-gold {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
      display: none;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-bar">
      <div class="logo"><i class="fa-solid fa-moon"></i> MIDNIGHT ARCANA</div>
      <div class="badge">闇夜のAI深層鑑定</div>
    </div>

    <div class="oracle-section">
      <div class="oracle-avatar">
        <i class="fa-solid fa-eye"></i>
      </div>
      <div class="oracle-info">
        <h2>深層の占者 レイラ</h2>
        <p>「あなたの迷いを、ここに書き記しなさい…」</p>
      </div>
    </div>

    <!-- 悩みの入力フィールド -->
    <div class="input-group">
      <label for="userQuery"><i class="fa-solid fa-feather"></i> あなたの悩みや相手との関係</label>
      <input type="text" id="userQuery" class="input-dark" placeholder="例：あの人は今、私のことをどう思っている？">
    </div>

    <div class="chat-box" id="chatMessage">
      深夜の闇へようこそ。上の欄にあなたの悩みを打ち込み、下の3枚のカードから直感で1枚選びなさい。カードとあなたの思念が共鳴します。
    </div>

    <div class="cards-area" id="cardsArea">
      <div class="tarot-card" onclick="selectCard(1)"><i class="fa-solid fa-wand-sparkles"></i></div>
      <div class="tarot-card" onclick="selectCard(2)"><i class="fa-solid fa-wand-sparkles"></i></div>
      <div class="tarot-card" onclick="selectCard(3)"><i class="fa-solid fa-wand-sparkles"></i></div>
    </div>

    <div class="action-row">
      <button class="btn-dark" id="actionBtn" onclick="startReading()">運命のカードを引く</button>
      <a href="https://buy.stripe.com/7sY00i95A62B6gX0luEZ20k" target="_blank" class="btn-dark btn-gold" id="payBtn">
        <i class="fa-solid fa-lock"></i> 禁断の深層へ踏み込む（¥300）
      </a>
    </div>

    <div class="footer-note">
      © Midnight Arcana • Powered by Stripe & Vercel
    </div>
  </div>

  <script>
    let selectedCardNum = null;

    function selectCard(num) {
      selectedCardNum = num;
      document.querySelectorAll('.tarot-card').forEach((card, index) => {
        if(index + 1 === num) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      });
      const query = document.getElementById('userQuery').value.trim();
      const targetText = query ? `「${query}」というあなたの迷いについて` : "あなたの心に秘めた迷いについて";
      document.getElementById('chatMessage').innerText = `${targetText}、第 ${num} のカードが共鳴しました。「運命の結末を覗く」を押してください。`;
      document.getElementById('actionBtn').innerText = '運命の結末を覗く';
    }

    function startReading() {
      const query = document.getElementById('userQuery').value.trim();
      if(!query) {
        alert('まずは上の欄にあなたの悩みや気になることを入力してください。');
        return;
      }
      if(!selectedCardNum) {
        alert('下の3枚のカードから1枚選んでください。');
        return;
      }

      const results = [
        `【死神・正位置】「${query}」に関するあなたの問いに対し、カードは『古い関係の終わりと強制的な転換』を示しています。あの人は今、あなたとの間に壁を作っているように見えますが、それは防衛本能にすぎません。（※これより先の『あの人のスマホ事情・隠された本音』を覗くには、下の黄金の禁断ボタンを解除してください）`,
        `【恋人・逆位置】「${query}」の深層には、見えないすれ違いと誘惑の影が潜んでいます。相手もあなたを意識していながら、一歩を踏み出すのを恐れています。（※これより先の『あの人のスマホ事情・隠された本音』を覗くには、下の黄金の禁断ボタンを解除してください）`,
        `【月・正位置】「${query}」に関して、現在あなたは深い霧の中にいます。相手の真意が見えにくい夜ですが、あなたの直感は真実を捉えています。（※これより先の『あの人のスマホ事情・隠された本音』を覗くには、下の黄金の禁断ボタンを解除してください）`
      ];

      document.getElementById('chatMessage').innerText = results[selectedCardNum - 1];
      document.getElementById('actionBtn').innerText = 'もう一度占う';
      document.getElementById('actionBtn').onclick = function() { location.reload(); };
      document.getElementById('payBtn').style.display = 'block';
    }
  </script>

</body>
</html>
